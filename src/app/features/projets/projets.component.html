<section id="projets">
    <app-section-label text="02 — Projets" title="Mes réalisations" />

    <div class="projects-grid">
        @for (p of projets; track p.numero; let i = $index) {
            <div
                    class="project-card"
                    [class.featured]="p.featured"
                    appScrollReveal="slide-up"
                    [revealDelay]="i * 80"
                    (click)="openModal(p)"
                    role="button"
                    [attr.aria-label]="'Voir le projet ' + p.title"
                    tabindex="0"
                    (keydown.enter)="openModal(p)"
            >
                <div class="project-number">{{ p.numero }}</div>

                <div class="card-hint">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
                    </svg>
                    Voir le détail
                </div>

                <div class="project-icon">{{ p.icon }}</div>
                <h3 class="project-title">{{ p.title }}</h3>
                <p class="project-desc">{{ p.desc }}</p>
                <div class="project-stack">
                    @for (tech of p.stack; track tech) {
                        <span class="tag" [class.accent]="p.featured">{{ tech }}</span>
                    }
                </div>
            </div>
        }
    </div>
</section>

<app-projet-modal
        [projet]="selectedProjet()"
        [isOpen]="modalOpen()"
        (closed)="closeModal()"
/>
